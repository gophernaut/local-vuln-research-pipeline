# Local Vuln Research System Configuration
# Exhaustive source-to-sink path enumeration + per-path LLM analysis

model:
  name: "Qwen2.5-Coder-14B-Abliterated"
  quant: "Q4_K_M"
  file: "models/Qwen2.5-Coder-14B-Instruct-abliterated-Q4_K_M.gguf"
  download_url: "https://huggingface.co/bartowski/Qwen2.5-Coder-14B-Instruct-abliterated-GGUF"
  draft_file: "models/Qwen2.5-Coder-0.5B-Instruct-abliterated-Q4_K_M.gguf"
  draft_download_url: "https://huggingface.co/bartowski/Qwen2.5-Coder-0.5B-Instruct-abliterated-GGUF"

server:
  host: "127.0.0.1"
  port: 8080
  threads: 8
  batch_size: 2048
  ubatch_size: 512
  context_length: 32768
  flash_attn: true
  cache_type_k: "q4_0"
  cache_type_v: "q4_0"
  no_mmap: true
  speculative:
    enabled: true
    draft_n_max: 16
    draft_n_min: 0
    draft_p_min: 0.0
    draft_p_split: 0.1

pipeline:
  min_tokens_per_second: 8
  max_hypotheses: AUTO
  self_consistency_threshold: 0.7
  self_consistency_runs: 3
  max_deep_trace_files: 20
  early_termination: true
  parallel_analyzers: 16
  max_path_depth: 0
  max_paths_per_pair: 0
  max_llm_paths: 0
  llm_temperature: 0.3

scaling:
  max_files_per_chunk: 500
  max_file_size_bytes: 10000000
  skip_test_directories: true
  skip_vendor_directories: true
  max_functions_per_chunk: 50000
  max_call_graph_edges: 500000
  max_paths_total: 100000
  max_paths_per_source: 100
  max_paths_per_sink: 100
  llm_priority_top_n: 1000
  llm_batch_size: 16
  num_workers: 16
  auto_adapt_to_size: true

thresholds:
  hypothesis_confidence_cutoff: AUTO
  anomaly_ratio_sigma: 3.0
  epss_min_score: 0.05
  cvss_min_score: 7.0
  path_min_confidence: 0.5

knowledge:
  db_path: "data/cve/nvd.sqlite"
  update_interval_days: 7
  embedding_model: "all-MiniLM-L6-v2"
  sources:
    nvd: true
    epss: true
    kev: true

checkpoint:
  dir: "data/checkpoints"

logging:
  level: "INFO"
  file: "data/pipeline.log"

eval:
  corpora:
    owasp_benchmark: true
    juliet: true
    cvefixes: true
    bigvul: true
    diverse_vul: true
