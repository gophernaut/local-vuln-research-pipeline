# Local Vuln Research System Configuration
# Values with {AUTO} are set by benchmark/eval runs

model:
  name: "Qwen2.5-Coder-7B-Abliterated"
  quant: "Q6_K"
  file: "models/Qwen2.5-Coder-7B-Instruct-abliterated-Q6_K.gguf"
  download_url: "https://huggingface.co/bartowski/Qwen2.5-Coder-7B-Instruct-abliterated-GGUF"
  draft_file: "models/Qwen2.5-Coder-0.5B-Instruct-abliterated-Q4_K_M.gguf"
  draft_download_url: "https://huggingface.co/bartowski/Qwen2.5-Coder-0.5B-Instruct-abliterated-GGUF"

server:
  host: "127.0.0.1"
  port: 8080
  threads: 8
  batch_size: 2048
  ubatch_size: 512
  context_length: 131072     # 131K context — 7B model leaves ~9GB for KV cache
  flash_attn: true
  cache_type_k: "q4_0"
  cache_type_v: "q4_0"
  no_mmap: true
  speculative:
    enabled: true
    draft_n_max: 16
    draft_n_min: 0
    draft_p_min: 0.0
    draft_p_split: 0.1

pipeline:
  min_tokens_per_second: 8
  max_hypotheses: AUTO
  self_consistency_threshold: 0.7
  self_consistency_runs: 3
  max_deep_trace_files: 20
  early_termination: true
  parallel_analyzers: 16

thresholds:
  hypothesis_confidence_cutoff: AUTO
  anomaly_ratio_sigma: 3.0
  epss_min_score: 0.05
  cvss_min_score: 7.0

knowledge:
  db_path: "data/cve/nvd.sqlite"
  update_interval_days: 7
  embedding_model: "all-MiniLM-L6-v2"
  sources:
    nvd: true
    epss: true
    kev: true

checkpoint:
  dir: "data/checkpoints"

logging:
  level: "INFO"
  file: "data/pipeline.log"

eval:
  corpora:
    owasp_benchmark: true
    juliet: true
    cvefixes: true
    bigvul: true
    diverse_vul: true
